name: Security Audit

on:
  schedule:
    - cron: '30 18 * * 0' # Weekly on Sunday night at 00:00 IST (18:30 UTC)
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  audit-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Python dependencies
        run: cd ml-service && uv run --with pip-audit pip-audit


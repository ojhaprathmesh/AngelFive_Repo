name: Close Stale Issues

on:
  schedule:
    - cron: '30 18 * * 0' # Weekly on Sunday night at 00:00 IST (18:30 UTC)
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been inactive for 30 days and is marked stale.'
          stale-pr-message: 'This PR has been inactive for 14 days and is marked stale.'
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-close: 7

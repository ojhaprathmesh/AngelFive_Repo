services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    # Override command to run the dev server instead of production server
    command: sh -c "pnpm install --ignore-scripts --config.confirmModulesPurge=false && pnpm dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Used by browser-side fetches from host machine
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
      # Used by Next.js rewrites running inside the frontend container
      - BACKEND_INTERNAL_URL=http://backend:5000
      - NODE_OPTIONS=--no-warnings=DeprecationWarning
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - angelfive-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    command: sh -c "pnpm install --ignore-scripts --config.confirmModulesPurge=false && pnpm dev"
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000,http://frontend:3000
      - ML_SERVICE_URL=http://ml-service:8000
      - REDIS_URL=redis://redis:6379
      - NODE_OPTIONS=--no-warnings=DeprecationWarning
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./tsconfig.base.json:/tsconfig.base.json
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - angelfive-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    env_file:
      - ./ml-service/.env
    volumes:
      - ./ml-service:/app
      - /app/.venv
      - ml_model_cache:/app/model_cache
    networks:
      - angelfive-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - angelfive-network

networks:
  angelfive-network:
    driver: bridge

volumes:
  redis_data:
  ml_model_cache:

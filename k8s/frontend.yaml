apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: angelfive
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: angelfive
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: angelfive
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ojhaprathmesh/angelfive_repo-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: angelfive-config
                  key: PORT_FRONTEND
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: angelfive-config
                  key: NODE_ENV
            - name: BACKEND_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: angelfive-config
                  key: BACKEND_INTERNAL_URL
            - name: NEXT_PUBLIC_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: angelfive-config
                  key: NEXT_PUBLIC_BACKEND_URL
            - name: NODE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: angelfive-config
                  key: NODE_OPTIONS
          envFrom:
            - secretRef:
                name: angelfive-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: angelfive
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: angelfive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http

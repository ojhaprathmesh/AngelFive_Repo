apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angelfive-ingress
  namespace: angelfive
  labels:
    app.kubernetes.io/name: angelfive
    app.kubernetes.io/part-of: angelfive
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Route backend API requests
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          # Route frontend Next.js requests
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000

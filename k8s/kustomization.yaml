apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: angelfive

resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - ml-service.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

images:
  - name: ghcr.io/ojhaprathmesh/angelfive_repo-frontend
    newTag: latest
  - name: ghcr.io/ojhaprathmesh/angelfive_repo-backend
    newTag: latest
  - name: ghcr.io/ojhaprathmesh/angelfive_repo-ml-service
    newTag: latest

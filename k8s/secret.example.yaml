# Example secret template for AngelFive.
# Create the actual secret with:
#   kubectl create secret generic angelfive-secrets -n angelfive \
#     --from-literal=SMARTAPI_CLIENT_CODE="your_code" \
#     --from-literal=SMARTAPI_PASSWORD="your_password" \
#     --from-literal=SMARTAPI_TOTP_SECRET="your_totp_secret" \
#     --from-literal=SMARTAPI_API_KEY="your_api_key" \
#     ...
apiVersion: v1
kind: Secret
metadata:
  name: angelfive-secrets
  namespace: angelfive
  labels:
    app.kubernetes.io/name: angelfive
    app.kubernetes.io/part-of: angelfive
type: Opaque
stringData:
  # AngelOne SmartAPI Integration
  SMARTAPI_CLIENT_CODE: "your_client_code"
  SMARTAPI_PASSWORD: "your_password"
  SMARTAPI_TOTP_SECRET: "your_totp_secret_key"
  SMARTAPI_API_KEY: "your_smartapi_key"
  SMARTAPI_LOCAL_IP: "127.0.0.1"
  SMARTAPI_PUBLIC_IP: "127.0.0.1"
  SMARTAPI_MAC_ADDRESS: "00:00:00:00:00:00"

  # Firebase Admin SDK & Auth
  FIREBASE_API_KEY: "your_api_key"
  FIREBASE_AUTH_DOMAIN: "your_project_id.firebaseapp.com"
  FIREBASE_PROJECT_ID: "your_project_id"
  FIREBASE_STORAGE_BUCKET: "your_project_id.appspot.com"
  FIREBASE_MESSAGING_SENDER_ID: "1234567890"
  FIREBASE_APP_ID: "1:1234567890:web:abcdef123456"
  FIREBASE_CLIENT_EMAIL: "firebase-adminsdk@your_project_id.iam.gserviceaccount.com"
  FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nYOUR_KEY_HERE\n-----END PRIVATE KEY-----\n"

  # Google OAuth Client
  GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"

  # HuggingFace (Optional)
  HF_TOKEN: ""
